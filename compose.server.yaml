# Use after compose.local.yaml and compose.go-worker.yaml.
# Attach only the web application to an existing Nginx Docker network.
name: opentv-server

services:
  opentv:
    image: ${OPENTV_IMAGE:-opentv:server}
    ports: !reset []
    networks:
      default:
      proxy:
        aliases:
          - opentv-web

  opentv-go:
    image: ${OPENTV_GO_IMAGE:-opentv-go-worker:server}

  opentv-go-state-init:
    image: ${OPENTV_GO_IMAGE:-opentv-go-worker:server}

networks:
  proxy:
    external: true
    name: ${OPENTV_PROXY_NETWORK:?Set the existing reverse proxy Docker network}

volumes:
  database:
    name: opentv-server_database
  downloads:
    name: opentv-server_downloads
  postgres:
    name: opentv-server_postgres
  go-worker-state:
    name: opentv-server_go-worker-state
